name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopus0 libopus-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev,analysis]"
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest -q
      - name: Doctor
        run: starvoice doctor
